---
driver:
  name: vagrant

provisioner:
  name: policyfile_zero
  product_name: <%= ENV['CHEF_PRODUCT_NAME'] || 'chef' %>
  product_version: <%= ENV['CHEF_VERSION'] || 'latest' %>
  chef_license: accept-no-persist
  enforce_idempotency: true
  multiple_converge: 2
  deprecations_as_errors: true
  log_level: <%= ENV['CHEF_LOG_LEVEL'] || 'auto' %>
  policyfile: Policyfile.rb

verifier:
  name: inspec

platforms:
  - name: almalinux-8
  - name: almalinux-9
  - name: centos-stream-9
  - name: debian-12
  - name: debian-13
    attributes:
      mariadb_server_test_version: '11.8'
  - name: rockylinux-8
  - name: rockylinux-9
  - name: ubuntu-20.04
  - name: ubuntu-22.04
  - name: ubuntu-24.04

suites:
  - name: repository
    provisioner:
      named_run_list: repository
  - name: repository-10
    excludes:
      - debian-13
    provisioner:
      named_run_list: repository
    attributes:
      mariadb_server_test_version: '10.11'
    verifier:
      inspec_tests:
        - path: test/integration/repository
  - name: client_install
    provisioner:
      named_run_list: client_install
  - name: client_install-10
    excludes:
      - debian-13
    provisioner:
      named_run_list: client_install
    attributes:
      mariadb_server_test_version: '10.11'
    verifier:
      inspec_tests:
        - path: test/integration/client_install
  - name: client_distro_install
    provisioner:
      named_run_list: client_distro_install
  - name: server_install
    provisioner:
      named_run_list: server_install
  - name: server_install-10
    excludes:
      - debian-13
    provisioner:
      named_run_list: server_install
    attributes:
      mariadb_server_test_version: '10.11'
    verifier:
      inspec_tests:
        - path: test/integration/server_install
  - name: server_distro_install
    provisioner:
      named_run_list: server_distro_install
  - name: configuration
    provisioner:
      named_run_list: configuration
  - name: server_configuration
    provisioner:
      named_run_list: server_configuration
  - name: server_configuration_10
    excludes:
      - debian-13
    provisioner:
      named_run_list: server_configuration
    attributes:
      mariadb_server_test_version: '10.11'
    verifier:
      inspec_tests:
        - path: test/integration/server_configuration
  - name: resources
    provisioner:
      named_run_list: user_database
  - name: resources_10
    excludes:
      - debian-13
    provisioner:
      named_run_list: user_database
    attributes:
      mariadb_server_test_version: '10.11'
    verifier:
      inspec_tests:
        - path: test/integration/resources
  - name: replication
    provisioner:
      named_run_list: replication
  - name: replication_10
    excludes:
      - debian-13
    provisioner:
      named_run_list: replication
    attributes:
      mariadb_server_test_version: '10.11'
    verifier:
      inspec_tests:
        - path: test/integration/replication
  - name: datadir
    provisioner:
      named_run_list: datadir
  - name: datadir_10
    provisioner:
      named_run_list: datadir
    verifier:
      inspec_tests:
        - path: test/integration/datadir
  - name: port
    provisioner:
      named_run_list: port
  - name: port_10
    provisioner:
      named_run_list: port
    verifier:
      inspec_tests:
        - path: test/integration/port
  - name: galera_configuration
    provisioner:
      named_run_list: galera_configuration
  - name: galera_configuration_10
    excludes:
      - debian-13
    provisioner:
      named_run_list: galera_configuration
    attributes:
      mariadb_server_test_version: '10.11'
    verifier:
      inspec_tests:
        - path: test/integration/galera_configuration
